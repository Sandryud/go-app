basePath: /
definitions:
  internal_handler_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_handler_auth.LoginResponse:
    properties:
      email:
        type: string
      tokens:
        $ref: '#/definitions/workout-app_internal_handler_response.TokenPair'
      user_id:
        type: string
      username:
        type: string
    type: object
  internal_handler_auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_handler_auth.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        description: Username должен состоять только из букв и цифр (без пробелов
          и спецсимволов).
        maxLength: 32
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  internal_handler_auth.RegisterResponse:
    properties:
      email:
        type: string
      message:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  internal_handler_auth.ResendVerificationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_handler_auth.ResendVerificationResponse:
    properties:
      message:
        type: string
    type: object
  internal_handler_auth.RestoreAccountRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_handler_auth.RestoreAccountResponse:
    properties:
      email:
        type: string
      tokens:
        $ref: '#/definitions/workout-app_internal_handler_response.TokenPair'
      user_id:
        type: string
      username:
        type: string
    type: object
  internal_handler_auth.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  internal_handler_exercises.VersionResponse:
    properties:
      version:
        type: string
    type: object
  internal_handler_plans.CopyFromShareRequest:
    properties:
      name:
        type: string
    type: object
  internal_handler_plans.CreateDayExerciseRequest:
    properties:
      distance_meters:
        type: integer
      duration_seconds:
        type: integer
      exercise_id:
        maxLength: 100
        type: string
      is_superset:
        type: boolean
      reps:
        type: integer
      rest_seconds:
        type: integer
      sets:
        maximum: 20
        minimum: 1
        type: integer
      sort_order:
        type: integer
      weight_kg:
        type: number
    required:
    - exercise_id
    - sets
    type: object
  internal_handler_plans.CreateDayRequest:
    properties:
      name:
        maxLength: 200
        type: string
      sort_order:
        type: integer
    required:
    - name
    type: object
  internal_handler_plans.CreatePlanRequest:
    properties:
      category:
        enum:
        - mass_gain
        - strength
        - weight_loss
        - endurance
        - general
        type: string
      is_active:
        type: boolean
      is_public:
        type: boolean
      level:
        enum:
        - beginner
        - intermediate
        - advanced
        type: string
      name:
        maxLength: 200
        type: string
    required:
    - name
    type: object
  internal_handler_plans.DayExerciseResponse:
    properties:
      created_at:
        type: string
      day_id:
        type: string
      distance_meters:
        type: integer
      duration_seconds:
        type: integer
      exercise_id:
        type: string
      id:
        type: string
      is_superset:
        type: boolean
      reps:
        type: integer
      rest_seconds:
        type: integer
      sets:
        type: integer
      sort_order:
        type: integer
      superset_group:
        type: integer
      updated_at:
        type: string
      weight_kg:
        type: number
    type: object
  internal_handler_plans.DayResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      plan_id:
        type: string
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  internal_handler_plans.PlanCreatedResponse:
    properties:
      category:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_public:
        type: boolean
      level:
        type: string
      name:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  internal_handler_plans.PlanDayDetailResponse:
    properties:
      exercises:
        items:
          $ref: '#/definitions/internal_handler_plans.PlanDayExerciseItemResponse'
        type: array
      id:
        type: string
      name:
        type: string
      sort_order:
        type: integer
    type: object
  internal_handler_plans.PlanDayExerciseItemResponse:
    properties:
      distance_meters:
        type: integer
      duration_seconds:
        type: integer
      exercise_id:
        type: string
      id:
        type: string
      is_superset:
        type: boolean
      reps:
        type: integer
      rest_seconds:
        type: integer
      sets:
        type: integer
      sort_order:
        type: integer
      superset_group:
        type: integer
      weight_kg:
        type: number
    type: object
  internal_handler_plans.PlanDetailResponse:
    properties:
      category:
        type: string
      days:
        items:
          $ref: '#/definitions/internal_handler_plans.PlanDayDetailResponse'
        type: array
      id:
        type: string
      is_active:
        type: boolean
      level:
        type: string
      name:
        type: string
    type: object
  internal_handler_plans.PlanListItemResponse:
    properties:
      category:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      level:
        type: string
      name:
        type: string
    type: object
  internal_handler_plans.PlanUpdatedResponse:
    properties:
      category:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_public:
        type: boolean
      level:
        type: string
      name:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  internal_handler_plans.ShareCreatedResponse:
    properties:
      share_path:
        type: string
      share_token:
        type: string
      share_url:
        type: string
    type: object
  internal_handler_plans.ShareStatsResponse:
    properties:
      total_copies:
        type: integer
      unique_recipients:
        type: integer
    type: object
  internal_handler_plans.UpdateDayExerciseRequest:
    properties:
      distance_meters:
        type: integer
      duration_seconds:
        type: integer
      is_superset:
        type: boolean
      reps:
        type: integer
      rest_seconds:
        type: integer
      sets:
        maximum: 20
        minimum: 1
        type: integer
      sort_order:
        type: integer
      weight_kg:
        type: number
    type: object
  internal_handler_plans.UpdateDayRequest:
    properties:
      name:
        maxLength: 200
        type: string
      sort_order:
        type: integer
    type: object
  internal_handler_plans.UpdatePlanRequest:
    properties:
      category:
        enum:
        - mass_gain
        - strength
        - weight_loss
        - endurance
        - general
        type: string
      is_active:
        type: boolean
      is_public:
        type: boolean
      level:
        enum:
        - beginner
        - intermediate
        - advanced
        type: string
      name:
        maxLength: 200
        type: string
    type: object
  internal_handler_user.ChangeEmailRequest:
    properties:
      new_email:
        type: string
    required:
    - new_email
    type: object
  internal_handler_user.ChangeEmailResponse:
    properties:
      message:
        type: string
    type: object
  internal_handler_user.DeleteAccountRequest:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  internal_handler_user.ProfileResponse:
    properties:
      avatar_url:
        type: string
      birth_date:
        type: string
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      gender:
        type: string
      id:
        type: string
      last_name:
        type: string
      role:
        type: string
      training_level:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  internal_handler_user.ProfileUpdateRequest:
    properties:
      avatar_url:
        type: string
      birth_date:
        type: string
      first_name:
        type: string
      gender:
        type: string
      last_name:
        type: string
      training_level:
        type: string
      username:
        description: Username при обновлении также ограничен только буквами и цифрами.
        maxLength: 32
        minLength: 3
        type: string
    type: object
  internal_handler_user.PublicProfileResponse:
    properties:
      avatar_url:
        type: string
      birth_date:
        type: string
      created_at:
        type: string
      first_name:
        type: string
      gender:
        type: string
      id:
        type: string
      last_name:
        type: string
      role:
        type: string
      training_level:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  internal_handler_user.VerifyEmailChangeRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  workout-app_internal_handler_response.ErrorBody:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  workout-app_internal_handler_response.TokenPair:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
info:
  contact: {}
  description: 'API фитнес-приложения: аутентификация (JWT access + refresh) и профиль
    пользователя.'
  title: Workout App API
  version: "1.0"
paths:
  /api/v1/admin/users:
    get:
      description: Возвращает список всех активных пользователей. Доступно только
        для роли admin.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handler_user.ProfileResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Получить список всех пользователей (админ)
      tags:
      - user
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Аутентификация пользователя. Возвращает пару access/refresh токенов.
      parameters:
      - description: Данные для входа
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_handler_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
      summary: Вход по email и паролю
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Обновление пары access/refresh токенов по действительному refresh-токену.
      parameters:
      - description: Refresh токен
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_handler_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
      summary: Обновление токенов
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Регистрация по email/паролю/username. Возвращает пару access/refresh
        токенов.
      parameters:
      - description: Данные для регистрации
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_handler_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler_auth.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
      summary: Регистрация пользователя
      tags:
      - auth
  /api/v1/auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Отправляет новый код подтверждения на указанный email, если аккаунт
        ещё не подтверждён.
      parameters:
      - description: Email для повторной отправки кода
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_handler_auth.ResendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_auth.ResendVerificationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
      summary: Повторная отправка кода подтверждения email
      tags:
      - auth
  /api/v1/auth/restore:
    post:
      consumes:
      - application/json
      description: Восстанавливает мягко удалённый аккаунт по email и паролю. Возвращает
        профиль пользователя и пару access/refresh токенов.
      parameters:
      - description: Данные для восстановления
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_handler_auth.RestoreAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_auth.RestoreAccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
      summary: Восстановление удалённого аккаунта
      tags:
      - auth
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Подтверждает email пользователя по одноразовому коду и возвращает
        пару access/refresh токенов.
      parameters:
      - description: Данные для подтверждения email
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_handler_auth.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
      summary: Подтверждение email кодом
      tags:
      - auth
  /api/v1/exercises/data:
    get:
      description: 'Возвращает полный файл exercises.json. Поддерживает ETag: при
        заголовке If-None-Match, совпадающем с текущей версией, возвращается 304 Not
        Modified. Требуется авторизация.'
      parameters:
      - description: ETag версии каталога для условного запроса
        in: header
        name: If-None-Match
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Полный JSON каталога (meta + exercises)
          schema:
            type: string
        "304":
          description: Not Modified — версия клиента совпадает с текущей, тело пустое
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "404":
          description: Файл каталога не найден
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Данные каталога упражнений
      tags:
      - exercises
  /api/v1/exercises/version:
    get:
      description: Возвращает текущую версию каталога (meta.version из exercises.json).
        Требуется авторизация.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_exercises.VersionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Версия каталога упражнений
      tags:
      - exercises
  /api/v1/plans:
    get:
      description: Возвращает планы текущего пользователя (id, name, is_active, category,
        level, created_at) без вложенных дней.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handler_plans.PlanListItemResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Список планов текущего пользователя
      tags:
      - plans
    post:
      consumes:
      - application/json
      description: 'Создаёт новый план. Публичный план (is_public: true) может создавать
        только admin — иначе 403. category и level при указании должны быть из допустимых
        значений.'
      parameters:
      - description: Данные плана
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_handler_plans.CreatePlanRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler_plans.PlanCreatedResponse'
        "400":
          description: Некорректное тело запроса, недопустимая category или level
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Создать план
      tags:
      - plans
  /api/v1/plans/{id}:
    delete:
      description: Удаляет план (CASCADE удалит дни и упражнения в днях). Только владелец.
      parameters:
      - description: ID плана (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
      security:
      - BearerAuth: []
      summary: Удалить план
      tags:
      - plans
    get:
      description: 'Возвращает один план со вложенными днями и упражнениями в днях.
        Доступ: владелец или план публичный (is_public = true).'
      parameters:
      - description: ID плана (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_plans.PlanDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/workout-app_internal_handler_response.ErrorBody'
